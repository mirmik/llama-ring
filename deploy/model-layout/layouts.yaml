          16000 --max-summary 8192 --max-sessions {slots} --quantum 64 --cache-type
          q8_0 --ram-rotation 1 --slot-save-path {runtime_kv} --mtp-draft 3 --mmproj
          /home/mirmik/project/models/Qwen3.8-27B-Uncensored-vision-f16.gguf --mmproj-gpu
