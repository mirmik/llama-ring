          -ngl 99 -c 32768 -np {slots} -b 512 -ub 256 --host 0.0.0.0 --port {port}
          --slot-save-path {runtime_kv} --flash-attn on --jinja --cache-type-k q8_0
          --cache-type-v q8_0'
      stt-gigaam:
