        driver: llama_cpp
        gpu: local
        autoload: false
        on_demand: false
        port: 18198
        slots: 1
        context: 262144
        startup_timeout: 900
        command: env GGML_VK_DISABLE_MMVQ=1 {python} /home/mirmik/project/vcortex/llama-ring/scripts/serve.py
          --worker /home/mirmik/project/vcortex/llama-ring/build-qwen4/bin/llama-shadow-worker
