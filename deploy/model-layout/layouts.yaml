        gpu: local
        autoload: false
        on_demand: false
        port: 5056
        venv: /home/mirmik/project/models/stt-gigaam/venv
        startup_timeout: 240.0
        command: '{python} /home/mirmik/project/models/stt-gigaam/app/stt_server_gigaam.py'
        env:
          PYTHONPATH: /home/mirmik/project/models/stt-gigaam/runtime
          PYTHONUNBUFFERED: '1'
          STT_HOST: 127.0.0.1
          STT_PORT_OVERRIDE: '5056'
          GIGAAM_REVISION: 7655ad717f8122257385bb4b2f373db3697e8680
          HF_HUB_CACHE: /home/mirmik/project/models/stt-gigaam/huggingface-cache
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      bge-m3:
        driver: llama_cpp_embedding
        gpu: local
        autoload: false
        on_demand: false
        port: 8087
        slots: 2
        startup_timeout: 120.0
        command: '{defaults.llama_bin} --model /home/mirmik/project/models/bge-m3-Q8_0.gguf
          --host 127.0.0.1 --port {port} --embedding --pooling cls --parallel {slots}
          -ngl 99 -c 16384 -b 2048 -ub 2048'
      qwen3.8-27b-uncensored-q4-mtp-ring:
        driver: llama_cpp
        gpu: local
        autoload: false
        on_demand: false
        port: 18198
        slots: 1
        context: 114688
        startup_timeout: 600
        command: '{python} /home/mirmik/project/llama-ring-vision-20261008/scripts/serve.py
