          --model-name {name} --host 127.0.0.1 --port {port} --context 262144 --prefix
          24576 --max-summary 8192 --max-output 32768 --max-sessions {slots} --quantum
          256 --trigger .7 --cache-type q8_0 --ram-rotation 1 --mtp-draft 0 --timeout
          1800 --slot-save-path {runtime_kv}
    inference_settings:
