name: CPU build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/bootstrap.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python -m pytest -q tests
      - run: python scripts/export.py --output dist/llama-ring
